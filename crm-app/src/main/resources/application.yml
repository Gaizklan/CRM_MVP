server:
  # TLS en tránsito: la aplicación se despliega tras un proxy/balanceador que termina TLS.
  forward-headers-strategy: framework

spring:
  application:
    name: crm-platform
  datasource:
    url: ${CRM_DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${CRM_DB_USER:crm}
    password: ${CRM_DB_PASSWORD:crm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

crm:
  # Claves de cifrado de PII: SOLO por entorno o gestor de secretos (ADR 0002). Sin claves, la
  # aplicación no arranca.
  crypto:
    pii:
      active-key-id: ${CRM_PII_ENCRYPTION_KEY_ID:k1}
      active-key: ${CRM_PII_ENCRYPTION_KEY:}
      previous-keys: ${CRM_PII_PREVIOUS_KEYS:}
      blind-index-key: ${CRM_PII_BLIND_INDEX_KEY:}
  # TLS obligatorio con proveedores externos (SMTP STARTTLS, HTTPS).
  outbound-tls:
    allow-insecure-localhost: false
  # Primer usuario ADMIN, creado solo si no existe ningún usuario interno. Solo por entorno.
  bootstrap-admin:
    username: ${CRM_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${CRM_BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
